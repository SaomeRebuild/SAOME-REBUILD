name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ============================================================
  # 第一階段：偵測變更範圍
  # ============================================================
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      shared: ${{ steps.filter.outputs.shared }}
      docs_public: ${{ steps.filter.outputs.docs_public }}
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            frontend:
              - 'apps/frontend/**'
              - 'packages/shared/**'
              - 'wrangler.jsonc'
            backend:
              - 'apps/backend-workers/**'
              - 'packages/shared/**'
            shared:
              - 'packages/shared/**'
            docs_public:
              - 'docs/public/**'
            migrations:
              - 'supabase/migrations/**'

  # ============================================================
  # 第二階段：CI（typecheck / lint / unit-test）
  # Cloudflare Pages/Workers deploy 由 CF webhook 自動處理
  # ============================================================
  typecheck:
    needs: changes
    if: |
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
      - run: npm ci
      - run: npm run typecheck --workspace=apps/frontend

  lint:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
      - run: npm ci
      - run: npm run lint --workspace=apps/frontend

  test:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
      - run: npm ci
      - run: npm test --workspace=apps/frontend

  migrations:
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
      - run: npm ci
      # Phase 5.13 — Rule 035 migration apply pipeline: every local
      # supabase/migrations/*.sql must be in .applied-migrations.json.
      # Catches the 2026-08-22 production 500 incident where the agent
      # shipped a migration file but never applied it to the live DB.
      - run: npm run check:migrations --workspace=apps/backend
